<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Hat -->
  <polygon points="100,20 60,90 140,90" fill="#2E7D32"/>
  <ellipse cx="100" cy="90" rx="42" ry="10" fill="#1B5E20"/>
