  <rect x="96" y="163" width="8" height="12" rx="2" fill="#FFA000"/>
  <!-- Legs -->
  <rect x="78" y="182" width="18" height="20" rx="6" fill="#1B5E20"/>
  <rect x="104" y="182" width="18" height="20" rx="6" fill="#1B5E20"/>
  <!-- Boots -->
