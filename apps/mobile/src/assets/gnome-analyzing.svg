<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Hat (slightly tilted) -->
  <g transform="rotate(-8 100 60)">
    <polygon points="100,20 60,90 140,90" fill="#2E7D32"/>
    <ellipse cx="100" cy="90" rx="42" ry="10" fill="#1B5E20"/>
    <rect x="62" y="83" width="76" height="12" rx="6" fill="#4CAF50"/>
  </g>
  <!-- Face -->
  <ellipse cx="100" cy="116" rx="28" ry="26" fill="#FFCC80"/>
  <!-- Eyes (focused, narrowed) -->
  <ellipse cx="89" cy="111" rx="4.5" ry="3.5" fill="#4E342E"/>
  <ellipse cx="111" cy="111" rx="4.5" ry="3.5" fill="#4E342E"/>
  <circle cx="91" cy="110" r="1.5" fill="#FFFFFF"/>
  <circle cx="113" cy="110" r="1.5" fill="#FFFFFF"/>
  <!-- Focused brow -->
  <path d="M84 106 Q89 103 94 106" stroke="#795548" stroke-width="2" fill="none"/>
  <path d="M106 106 Q111 103 116 106" stroke="#795548" stroke-width="2" fill="none"/>
  <!-- Nose -->
  <ellipse cx="100" cy="118" rx="5" ry="4" fill="#FFAB40"/>
  <!-- Concentrated expression -->
  <path d="M90 127 Q100 125 110 127" stroke="#795548" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Beard -->
  <path d="M76 131 Q78 149 100 153 Q122 149 124 131" fill="#FAFAFA"/>
  <!-- Body -->
  <rect x="72" y="149" width="56" height="36" rx="10" fill="#2E7D32"/>
  <!-- Arm holding magnifying glass (right arm raised) -->
  <ellipse cx="60" cy="163" rx="14" ry="8" fill="#388E3C" transform="rotate(-20 60 163)"/>
  <path d="M140 155 L158 138" stroke="#388E3C" stroke-width="14" stroke-linecap="round"/>
  <!-- Hand -->
  <circle cx="50" cy="168" r="7" fill="#FFCC80"/>
  <circle cx="160" cy="136" r="8" fill="#FFCC80"/>
  <!-- Magnifying glass -->
  <circle cx="172" cy="120" r="14" stroke="#FFA000" stroke-width="4" fill="none"/>
  <circle cx="172" cy="120" r="9" fill="rgba(165,214,255,0.4)" stroke="none"/>
  <line x1="162" y1="130" x2="152" y2="140" stroke="#FFA000" stroke-width="4" stroke-linecap="round"/>
  <!-- Belt -->
  <rect x="72" y="166" width="56" height="8" rx="4" fill="#1B5E20"/>
  <rect x="96" y="164" width="8" height="12" rx="2" fill="#FFA000"/>
  <!-- Legs -->
  <rect x="78" y="183" width="18" height="20" rx="6" fill="#1B5E20"/>
  <rect x="104" y="183" width="18" height="20" rx="6" fill="#1B5E20"/>
  <!-- Boots -->
  <ellipse cx="87" cy="200" rx="12" ry="6" fill="#4E342E"/>
  <ellipse cx="113" cy="200" rx="12" ry="6" fill="#4E342E"/>
</svg>
