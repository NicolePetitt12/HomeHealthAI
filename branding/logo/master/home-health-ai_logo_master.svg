  <!-- Magnifying Glass -->
  <circle cx="330" cy="230" r="28" stroke="#FFFFFF" stroke-width="5" fill="#1A1A1A"/>
  
  <!-- Green Particles -->
  <circle cx="320" cy="225" r="4" fill="#22C55E"/>
  <circle cx="335" cy="240" r="5" fill="#22C55E"/>
  <circle cx="345" cy="220" r="3" fill="#22C55E"/>

  <!-- Handle -->
