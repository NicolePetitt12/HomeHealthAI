  </g>

  <!-- Gnome Head -->
  <circle cx="256" cy="220" r="70" fill="#F5D0A9"/>
  
  <!-- Beard -->
  <path d="M210 240 Q256 320 302 240 Q280 350 256 360 Q232 350 210 240"
