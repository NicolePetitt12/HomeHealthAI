  <ellipse cx="100" cy="117" rx="5" ry="4" fill="#FFAB40"/>
  <!-- Smile -->
  <path d="M88 126 Q100 134 112 126" stroke="#795548" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Beard -->
  <ellipse cx="100" cy="135" rx="26" ry="16" fill="#FAFAFA"/>
